<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Walking Tours</title>
<meta name="description" content="A small collection of self-guided, open-air city walking tours: maps with stories, walking times and one-tap navigation.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Archivo:wght@500;600;700&display=swap">
<style>
  :root{
    --bg:#E6DEC9; --paper:#F3EEDD; --paper-2:#EAE1C8;
    --ink:#2A2824; --ink-soft:#5E574A; --ink-faint:#8C8370;
    --line:#D2C5A4; --line-soft:#E0D7BE;
    --teal:#1F5E54; --teal-ink:#164A42; --gold:#B4832A; --gold-ink:#8E6718;
    --font-display:"Cinzel",Georgia,serif; --font-serif:"Spectral",Georgia,serif;
    --font-ui:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
    --shadow:0 1px 2px rgba(42,40,36,.08),0 10px 28px rgba(42,40,36,.10);
    --shadow-soft:0 1px 2px rgba(42,40,36,.07); --radius:4px; color-scheme:light;
  }
  :root:not([data-theme="light"]){ @media (prefers-color-scheme:dark){
    --bg:#15201D; --paper:#1E2825; --paper-2:#192220; --ink:#ECE3CF; --ink-soft:#BBB199; --ink-faint:#8C8370;
    --line:#35423C; --line-soft:#283430; --teal:#44998B; --teal-ink:#5FB3A4; --gold:#D7A445; --gold-ink:#E3B863;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.4); --shadow-soft:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#15201D; --paper:#1E2825; --paper-2:#192220; --ink:#ECE3CF; --ink-soft:#BBB199; --ink-faint:#8C8370;
    --line:#35423C; --line-soft:#283430; --teal:#44998B; --teal-ink:#5FB3A4; --gold:#D7A445; --gold-ink:#E3B863;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.4); --shadow-soft:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background-color:var(--bg);
    background-image:
      radial-gradient(60rem 40rem at 110% -10%, rgba(31,94,84,.08), transparent 60%),
      radial-gradient(50rem 40rem at -10% 110%, rgba(180,131,42,.08), transparent 60%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='0.035'/></svg>");
    color:var(--ink); font-family:var(--font-serif); font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;
    min-height:100%;
  }
  .wrap{max-width:900px;margin:0 auto;padding:0 20px}
  header{position:relative;overflow:hidden;border-bottom:1px double var(--line)}
  header::after{content:"\f14e";font-family:"Font Awesome 6 Free";font-weight:900;position:absolute;right:-18px;top:-30px;
    font-size:200px;color:var(--teal);opacity:.06;transform:rotate(12deg);pointer-events:none}
  .hero{max-width:900px;margin:0 auto;padding:38px 20px 30px;position:relative}
  .tag{display:inline-flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:2px;
    padding:6px 12px;color:var(--gold-ink);box-shadow:var(--shadow-soft)}
  .label{font-family:var(--font-ui);font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:600}
  h1{font-family:var(--font-display);font-weight:700;letter-spacing:.03em;text-transform:uppercase;line-height:1.03;
    font-size:clamp(34px,9vw,60px);margin:16px 0 0;text-wrap:balance}
  .hero p{font-family:var(--font-serif);font-size:17px;color:var(--ink-soft);max-width:54ch;margin:12px 0 0}
  #langToggle{position:absolute;top:26px;right:20px;display:inline-flex;align-items:center;gap:8px;font-family:var(--font-ui);
    font-weight:600;font-size:12.5px;cursor:pointer;background:var(--teal);color:#f5efe0;border:none;border-radius:2px;padding:9px 13px;box-shadow:var(--shadow-soft)}
  #langToggle:hover{filter:brightness(1.07)}
  @media (prefers-color-scheme:dark){#langToggle{color:#11201d}}
  :root[data-theme="dark"] #langToggle{color:#11201d}

  main{padding:34px 0 60px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
  .tour{display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);text-decoration:none;color:inherit;overflow:hidden;transition:transform .14s ease,box-shadow .14s ease}
  .tour:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(42,40,36,.1),0 16px 36px rgba(42,40,36,.16)}
  .tour .banner{height:92px;display:grid;place-items:center;background:
    repeating-linear-gradient(135deg,rgba(31,94,84,.10),rgba(31,94,84,.10) 10px,transparent 10px,transparent 20px),var(--paper-2);
    border-bottom:1px dashed var(--line)}
  .tour .banner i{font-size:34px;color:var(--teal)}
  .tour .body{padding:16px 16px 18px}
  .tour .body .label{color:var(--gold-ink)}
  .tour h2{font-family:var(--font-display);font-weight:600;font-size:22px;margin:4px 0 0}
  .tour .sub{font-size:14px;color:var(--ink-soft);margin:6px 0 0}
  .tour .meta{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-ui);font-size:12px;color:var(--ink-faint);margin-top:12px}
  .tour .meta i{color:var(--teal)}
  .soon{opacity:.72;cursor:default}
  .soon:hover{transform:none;box-shadow:var(--shadow)}
  .soon .banner i{color:var(--ink-faint)}
  footer{font-family:var(--font-ui);font-size:12.5px;color:var(--ink-faint);text-align:center;padding:0 20px 40px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="hero">
    <button id="langToggle" type="button"><i class="fa-solid fa-earth-europe"></i><span id="langToggleLbl">PT</span></button>
    <span class="tag"><i class="fa-solid fa-compass" style="color:var(--gold-ink)"></i><span class="label" id="eyebrow"></span></span>
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
</header>
<main class="wrap">
  <div class="grid" id="grid"></div>
</main>
<footer><span id="footText"></span></footer>

<script>
"use strict";
const T = {
  en:{
    htmlLang:"en", docTitle:"Walking Tours",
    eyebrow:"Self-guided · open air",
    title:"Walking Tours",
    subtitle:"A small, growing collection of self-guided, open-air city tours. Each one is a map with stories, walking times and one-tap navigation.",
    foot:"Made with care, one city at a time.",
    tours:[
      {href:"berlin/", icon:"fa-archway", soon:false, name:"Berlin",
       sub:"The open-air heart of the city, on foot from Alexanderplatz.", meta:"14 stops + 3 plus"},
      {href:null, icon:"fa-plus", soon:true, name:"More cities", sub:"New open-air tours will land here over time.", meta:"Coming soon"}
    ],
    toggleTo:"PT"
  },
  pt:{
    htmlLang:"pt-BR", docTitle:"Passeios a Pé",
    eyebrow:"Autoguiado · ao ar livre",
    title:"Passeios a Pé",
    subtitle:"Uma coleção pequena e crescente de passeios a pé autoguiados, ao ar livre. Cada um é um mapa com historinhas, tempos de caminhada e navegação num toque.",
    foot:"Feito com carinho, uma cidade de cada vez.",
    tours:[
      {href:"berlin/", icon:"fa-archway", soon:false, name:"Berlim",
       sub:"O coração a céu aberto da cidade, a pé a partir da Alexanderplatz.", meta:"14 paradas + 3 plus"},
      {href:null, icon:"fa-plus", soon:true, name:"Mais cidades", sub:"Novos passeios ao ar livre vão aparecer aqui com o tempo.", meta:"Em breve"}
    ],
    toggleTo:"EN"
  }
};

function render(lang){
  const t = T[lang];
  document.documentElement.lang = t.htmlLang;
  document.title = t.docTitle;
  document.getElementById("eyebrow").textContent = t.eyebrow;
  document.getElementById("title").textContent = t.title;
  document.getElementById("subtitle").textContent = t.subtitle;
  document.getElementById("footText").textContent = t.foot;
  document.getElementById("langToggleLbl").textContent = t.toggleTo;
  document.getElementById("grid").innerHTML = t.tours.map(tour=>{
    const inner = `
      <div class="banner"><i class="fa-solid ${tour.icon}"></i></div>
      <div class="body">
        <div class="label">${tour.soon ? "" : "Tour"}</div>
        <h2>${tour.name}</h2>
        <p class="sub">${tour.sub}</p>
        <span class="meta"><i class="fa-solid ${tour.soon?'fa-hourglass-half':'fa-location-dot'}"></i> ${tour.meta}</span>
      </div>`;
    return tour.soon
      ? `<div class="tour soon">${inner}</div>`
      : `<a class="tour" href="${tour.href}">${inner}</a>`;
  }).join("");
}

function detectLang(){
  try{ const s=localStorage.getItem("bwt_lang"); if(s==="en"||s==="pt") return s; }catch(e){}
  const nav=(navigator.languages&&navigator.languages[0])||navigator.language||"en";
  return nav.toLowerCase().startsWith("pt") ? "pt" : "en";
}
let lang = detectLang();
render(lang);
document.getElementById("langToggle").addEventListener("click",()=>{
  lang = lang==="en" ? "pt" : "en";
  try{ localStorage.setItem("bwt_lang",lang); }catch(e){}
  render(lang);
});
</script>
</body>
</html>
