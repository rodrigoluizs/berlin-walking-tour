<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Berlin in the Open Air — Walking Tour</title>
<meta name="description" content="A bilingual self-guided walking tour of Berlin's open-air landmarks, with a story for each stop, walking times and Apple Maps navigation.">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Archivo:wght@500;600;700&display=swap">

<style>
  /* ---------- palette: "vintage atlas" ---------- */
  :root{
    --bg:#E6DEC9; --paper:#F3EEDD; --paper-2:#EAE1C8;
    --ink:#2A2824; --ink-soft:#5E574A; --ink-faint:#8C8370;
    --line:#D2C5A4; --line-soft:#E0D7BE;
    --teal:#1F5E54; --teal-ink:#164A42;
    --gold:#B4832A; --gold-ink:#8E6718;
    --brick:#A9472E; --plum:#6B5572; --navy:#2C4A6E;
    --east:#A9472E; --central:#1F5E54; --west:#B4832A; --opt:#6B5572; --home:#2C4A6E;
    --font-display:"Cinzel",Georgia,"Times New Roman",serif;
    --font-serif:"Spectral",Georgia,serif;
    --font-ui:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
    --shadow:0 1px 2px rgba(42,40,36,.08),0 10px 28px rgba(42,40,36,.10);
    --shadow-soft:0 1px 2px rgba(42,40,36,.07);
    --radius:4px;
    color-scheme:light;
  }
  :root:not([data-theme="light"]){ @media (prefers-color-scheme:dark){
    --bg:#15201D; --paper:#1E2825; --paper-2:#192220;
    --ink:#ECE3CF; --ink-soft:#BBB199; --ink-faint:#8C8370;
    --line:#35423C; --line-soft:#283430;
    --teal:#44998B; --teal-ink:#5FB3A4;
    --gold:#D7A445; --gold-ink:#E3B863;
    --brick:#D06A50; --plum:#A58AAE; --navy:#6E97C7;
    --east:#D06A50; --central:#44998B; --west:#D7A445; --opt:#A58AAE; --home:#6E97C7;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.4);
    --shadow-soft:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#15201D; --paper:#1E2825; --paper-2:#192220;
    --ink:#ECE3CF; --ink-soft:#BBB199; --ink-faint:#8C8370;
    --line:#35423C; --line-soft:#283430;
    --teal:#44998B; --teal-ink:#5FB3A4;
    --gold:#D7A445; --gold-ink:#E3B863;
    --brick:#D06A50; --plum:#A58AAE; --navy:#6E97C7;
    --east:#D06A50; --central:#44998B; --west:#D7A445; --opt:#A58AAE; --home:#6E97C7;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.4);
    --shadow-soft:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background-color:var(--bg);
    background-image:
      radial-gradient(60rem 40rem at 110% -10%, rgba(31,94,84,.08), transparent 60%),
      radial-gradient(50rem 40rem at -10% 110%, rgba(180,131,42,.08), transparent 60%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='0.035'/></svg>");
    color:var(--ink);
    font-family:var(--font-serif);
    font-size:16px;line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1040px;margin:0 auto;padding-inline:20px}
  a{color:var(--teal-ink)}
  .ui{font-family:var(--font-ui)}
  .label{font-family:var(--font-ui);font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:600}

  /* ---------- header ---------- */
  header{position:relative;overflow:hidden;border-bottom:1px double var(--line)}
  header::after{
    content:"\f14e"; font-family:"Font Awesome 6 Free"; font-weight:900;
    position:absolute; right:-18px; top:-24px; font-size:190px; color:var(--teal);
    opacity:.06; transform:rotate(12deg); pointer-events:none;
  }
  .hero{max-width:1040px;margin:0 auto;padding:30px 20px 26px;position:relative}
  .back{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-ui);font-size:12px;
    font-weight:600;text-decoration:none;color:var(--ink-faint);margin-bottom:14px}
  .back:hover{color:var(--ink)}
  .tag{display:inline-flex;align-items:center;gap:8px;background:var(--paper);
    border:1px solid var(--line);border-radius:2px;padding:6px 12px;color:var(--gold-ink);box-shadow:var(--shadow-soft)}
  .tag .label{color:var(--gold-ink)}
  h1{font-family:var(--font-display);font-weight:700;letter-spacing:.02em;line-height:1.04;
    font-size:clamp(30px,7.5vw,54px);margin:16px 0 0;text-transform:uppercase;text-wrap:balance}
  .hero .sub{font-family:var(--font-serif);font-size:17px;color:var(--ink-soft);max-width:56ch;margin:12px 0 0}
  .rule{height:1px;background:repeating-linear-gradient(90deg,var(--line),var(--line) 6px,transparent 6px,transparent 12px);margin:20px 0 0}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
  .chip{display:inline-flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);
    border-radius:2px;padding:6px 12px;font-family:var(--font-ui);font-size:12.5px;font-weight:500;color:var(--ink-soft);box-shadow:var(--shadow-soft)}
  .chip i{color:var(--teal);font-size:12px}

  #langToggle{position:absolute;top:22px;right:20px;display:inline-flex;align-items:center;gap:8px;
    font-family:var(--font-ui);font-weight:600;font-size:12.5px;letter-spacing:.04em;cursor:pointer;
    background:var(--teal);color:#f5efe0;border:none;border-radius:2px;padding:9px 13px;box-shadow:var(--shadow-soft)}
  #langToggle:hover{filter:brightness(1.07)}
  @media (prefers-color-scheme:dark){#langToggle{color:#11201d}}
  :root[data-theme="dark"] #langToggle{color:#11201d}

  section{padding:30px 0 10px}
  .sec-head{display:flex;align-items:flex-end;gap:12px;margin-bottom:14px}
  .sec-head .no{font-family:var(--font-display);font-weight:600;color:var(--gold);font-size:20px}
  h2{font-family:var(--font-display);font-weight:600;font-size:clamp(20px,4vw,26px);margin:0;letter-spacing:.01em}
  .sec-sub{font-family:var(--font-serif);color:var(--ink-soft);font-size:15px;margin:2px 0 16px}

  .mapframe{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:8px}
  .mapframe::before{content:"";position:absolute;inset:3px;border:1px solid var(--line-soft);border-radius:2px;pointer-events:none;z-index:500}
  #map{width:100%;height:66vh;min-height:400px;border-radius:2px;background:var(--paper-2)}
  .legend{display:flex;flex-wrap:wrap;gap:12px 18px;margin:14px 4px 2px;font-family:var(--font-ui);font-size:12.5px;color:var(--ink-soft)}
  .legend span{display:inline-flex;align-items:center;gap:7px}
  .dot{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--paper),0 0 0 3px currentColor}

  .notes{display:grid;gap:10px;margin-top:16px}
  .note{display:flex;gap:11px;background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--gold);
    border-radius:var(--radius);padding:12px 14px;font-family:var(--font-serif);font-size:14px;color:var(--ink-soft)}
  .note i{color:var(--gold-ink);font-size:15px;margin-top:3px}
  .note b{color:var(--ink);font-weight:600}

  .stamp{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#f5efe0;
    font-family:var(--font-display);font-weight:700;font-size:15px;border:2px solid #f5efe0;
    box-shadow:0 0 0 1.5px currentColor,0 3px 6px rgba(0,0,0,.35);transition:transform .14s ease}
  .stamp:hover{transform:scale(1.12) rotate(-4deg)}
  .stamp-central{background:var(--central);color:var(--central)}
  .stamp-west{background:var(--west);color:var(--west)}
  .stamp-opt{background:var(--opt);color:var(--opt)}
  .stamp span{color:#f6f1e3}
  .stamp-home{background:var(--home);color:var(--home)}

  .leaflet-popup-content-wrapper{background:var(--paper);color:var(--ink);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line)}
  .leaflet-popup-tip{background:var(--paper);border:1px solid var(--line)}
  .leaflet-popup-content{margin:0;width:290px!important;font-family:var(--font-serif)}
  .pop-head{display:flex;align-items:center;gap:11px;padding:13px 15px 10px;border-bottom:1px dashed var(--line)}
  .pop-ico{width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;color:#f5efe0;font-size:16px;box-shadow:0 0 0 1.5px currentColor inset}
  .pop-ico.a-central{background:var(--central)}.pop-ico.a-west{background:var(--west)}.pop-ico.a-opt{background:var(--opt)}
  .pop-ht{min-width:0}
  .pop-ht .label{color:var(--gold-ink);margin-bottom:1px}
  .pop-ht h3{font-family:var(--font-display);font-weight:600;font-size:16px;margin:0;line-height:1.15;color:var(--ink)}
  .pop-body{padding:11px 15px 14px}
  .leg{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-ui);font-size:11.5px;color:var(--ink-faint);margin-bottom:9px}
  .leg i{color:var(--teal)}
  .leg.drive i{color:var(--gold-ink)}
  .card .leg{margin:0 0 10px}
  .pop-dur{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-ui);font-size:12px;color:var(--ink-soft);
    background:var(--paper-2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;margin-bottom:9px}
  .pop-body p.desc{margin:0 0 9px;font-size:14px;color:var(--ink-soft)}
  .story{position:relative;background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius);padding:11px 13px 12px;margin:0 0 11px}
  .story .label{display:flex;align-items:center;gap:7px;color:var(--gold-ink);margin-bottom:5px}
  .story p{margin:0;font-family:var(--font-serif);font-style:italic;font-size:14px;line-height:1.55;color:var(--ink)}
  .pop-park{display:flex;gap:8px;align-items:flex-start;font-family:var(--font-ui);font-size:12px;color:var(--ink-faint);margin:0 0 11px}
  .pop-park i{color:var(--ink-soft);margin-top:2px}
  .btns{display:flex;flex-wrap:wrap;gap:8px}
  .btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-ui);font-weight:600;font-size:13px;
    text-decoration:none;padding:9px 13px;border-radius:2px;border:1px solid transparent;cursor:pointer}
  .btn-go{background:var(--teal);color:#f5efe0}
  .btn-go:hover{filter:brightness(1.07)}
  @media (prefers-color-scheme:dark){.btn-go{color:#11201d}}
  :root[data-theme="dark"] .btn-go{color:#11201d}
  .btn-park{background:transparent;border-color:var(--line);color:var(--ink-soft)}
  .btn-park:hover{border-color:var(--ink-faint);color:var(--ink)}

  .stops{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
  .card{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 16px 16px 18px}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:var(--radius) 0 0 var(--radius)}
  .card.a-central::before{background:var(--central)}.card.a-west::before{background:var(--west)}.card.a-opt::before{background:var(--opt)}
  .card-head{display:flex;align-items:center;gap:12px}
  .card-stamp{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;color:#f5efe0;
    font-family:var(--font-display);font-weight:700;font-size:16px;border:2px solid var(--paper);box-shadow:0 0 0 1.5px currentColor}
  .card.a-central .card-stamp{background:var(--central);color:var(--central)}
  .card.a-west .card-stamp{background:var(--west);color:var(--west)}
  .card.a-opt .card-stamp{background:var(--opt);color:var(--opt)}
  .card-stamp span{color:#f6f1e3}
  .card-ht{min-width:0}
  .card-ht .label{color:var(--gold-ink)}
  .card-ht h3{font-family:var(--font-display);font-weight:600;font-size:17px;line-height:1.15;margin:2px 0 0;color:var(--ink)}
  .card-ht h3 i{color:var(--teal);font-size:14px;margin-right:6px}
  .card .dur{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-ui);font-size:11.5px;color:var(--ink-soft);
    background:var(--paper-2);border:1px solid var(--line);border-radius:999px;padding:2px 9px;margin:11px 0 0}
  .card p.desc{margin:9px 0 0;font-size:14px;color:var(--ink-soft)}
  .card .story{margin-top:11px}
  .card .park{display:flex;gap:7px;align-items:flex-start;font-family:var(--font-ui);font-size:12px;color:var(--ink-faint);margin-top:10px}
  .card .park i{color:var(--ink-soft);margin-top:2px}
  .card .btns{margin-top:12px}

  footer{border-top:1px double var(--line);margin-top:28px}
  .foot{max-width:1040px;margin:0 auto;padding:22px 20px 40px;font-family:var(--font-ui);font-size:12.5px;color:var(--ink-faint)}
  .foot .cr{display:flex;align-items:center;gap:8px}
  .foot i{color:var(--gold)}

  @media (max-width:560px){
    .stops{grid-template-columns:1fr}
    .btn{flex:1 1 auto;justify-content:center}
    header::after{font-size:130px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="hero">
    <button id="langToggle" class="ui" type="button"><i class="fa-solid fa-earth-europe"></i><span id="langToggleLbl">PT</span></button>
    <a class="back" href="../" id="backLink"><i class="fa-solid fa-arrow-left"></i><span id="backLbl"></span></a>
    <span class="tag"><i class="fa-solid fa-compass" style="color:var(--gold-ink)"></i><span class="label" id="eyebrow"></span></span>
    <h1 id="title"></h1>
    <p class="sub" id="subtitle"></p>
    <div class="rule"></div>
    <div class="chips" id="chips"></div>
  </div>
</header>

<main class="wrap">
  <section>
    <div class="sec-head"><span class="no">I</span><h2 id="secMapTitle"></h2></div>
    <p class="sec-sub" id="secMapSub"></p>
    <div class="mapframe"><div id="map"></div></div>
    <div class="legend" id="legend"></div>
    <div class="notes" id="notes"></div>
  </section>

  <section>
    <div class="sec-head"><span class="no">II</span><h2 id="secListTitle"></h2></div>
    <p class="sec-sub" id="secListSub"></p>
    <div class="stops" id="stops"></div>
  </section>
</main>

<footer>
  <div class="foot"><span class="cr"><i class="fa-solid fa-map-location-dot"></i><span id="footText"></span></span></div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
"use strict";

/* ===== interface strings ===== */
const T = {

    chips:[["fa-shoe-prints","Mostly on foot"],["fa-cloud-sun","100% open air"],["fa-square-parking","Park once · Alexanderplatz"]],

    secMapTitle:"The route",

          side:"Passeio à parte (de carro)" }
  }
};

/* ===== data (code in English, content bilingual) ===== */
const HOME = {lat:52.5126, lng:13.4968};
const STOPS = [
  {n:1, key:"central", icon:"fa-tower-observation", lat:52.5215, lng:13.4105, dur:"20–30 min",
   parkNav:"Parkhaus Alexa, Berlin",
   name:{en:"Alexanderplatz & TV Tower", pt:"Alexanderplatz & Torre de TV"},
   area:{en:"Central Mitte", pt:"Mitte central"},
   desc:{en:"A big square with the World Clock and the TV Tower rising above. This is where you park, once, and set off on foot.",
         pt:"Praça grande com o Relógio Mundial e a Torre de TV despontando. É aqui que você estaciona, uma vez, e começa a caminhada."},
   park:{en:"Park once here (Alexa garage); the whole core is on foot from here.", pt:"Estacione aqui uma vez (garagem Alexa); o miolo todo é a pé a partir daqui."},
   story:{en:"This tower was the pride of former communist Germany, which wanted to show the world it was modern and powerful. But something funny happened: when the sun hits the glass ball up top, the shape of a cross appears. The government was against religion and was furious, but there was no way to remove it. People nicknamed it 'the Pope's Revenge'. And the big clock on the square was where sweethearts arranged to meet.",

  {n:2, key:"central", icon:"fa-landmark", lat:52.5188, lng:13.4083, dur:"15 min",
   name:{en:"Rotes Rathaus (Red City Hall)", pt:"Rotes Rathaus (Prefeitura Vermelha)"},

/* ===== helpers ===== */
const appleNav  = (lat,lng) => `https://maps.apple.com/?daddr=${lat},${lng}&dirflg=d`;
const appleQ    = q => `https://maps.apple.com/?daddr=${encodeURIComponent(q)}&dirflg=d`;

function haversine(aLat,aLng,bLat,bLng){
  const R=6371000, r=Math.PI/180;
  const dLa=(bLat-aLat)*r, dLo=(bLng-aLng)*r;
  const h=Math.sin(dLa/2)**2+Math.cos(aLat*r)*Math.cos(bLat*r)*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
// leg from the previous stop: side-trip for plus, drive for the first hop, otherwise walking time
function legHTML(lang,i){
  const L=T[lang].leg;
  if(STOPS[i].key==="opt") return `<div class="leg drive"><i class="fa-solid fa-car"></i> ${L.side}</div>`;
  if(i===0) return `<div class="leg drive"><i class="fa-solid fa-car"></i> ${L.start}</div>`;
  const p=STOPS[i-1], c=STOPS[i];
  const mins=Math.round(haversine(p.lat,p.lng,c.lat,c.lng)*1.3/80);
  return mins<=18
    ? `<div class="leg"><i class="fa-solid fa-person-walking"></i> ${L.walk(mins,p.name[lang])}</div>`
    : `<div class="leg drive"><i class="fa-solid fa-car"></i> ${L.drive(p.name[lang])}</div>`;
}

/* ===== map (built once) ===== */
const map = L.map("map",{scrollWheelZoom:true});
const base = {
  streets:L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"Tiles &copy; Esri"}),
  sat:L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"Tiles &copy; Esri"})
};
base.streets.addTo(map);
L.polyline(STOPS.filter(s=>s.key!=="opt").map(s=>[s.lat,s.lng]),
  {color:"#1F5E54",weight:3,opacity:.6,dashArray:"2 9",lineCap:"round"}).addTo(map);
const markers = L.layerGroup().addTo(map);
let layerCtl = null;
let fitted = false;

/* ===== render for a given language ===== */
function render(lang){
  const t = T[lang];
  const S = s => s[lang];

  document.documentElement.lang = t.htmlLang;
  document.title = t.docTitle;
  document.getElementById("backLbl").textContent = t.back;
  document.getElementById("eyebrow").textContent = t.eyebrow;
  document.getElementById("title").textContent = t.title;
  document.getElementById("subtitle").innerHTML = t.subtitle;
  document.getElementById("secMapTitle").textContent = t.secMapTitle;
  document.getElementById("secMapSub").textContent = t.secMapSub;
  document.getElementById("secListTitle").textContent = t.secListTitle;
  document.getElementById("secListSub").textContent = t.secListSub;
  document.getElementById("footText").textContent = t.foot;
  document.getElementById("langToggleLbl").textContent = t.toggleTo;

  document.getElementById("chips").innerHTML = t.chips
    .map(([ic,txt])=>`<span class="chip"><i class="fa-solid ${ic}"></i>${txt}</span>`).join("");
  document.getElementById("legend").innerHTML = t.legend
    .map(([k,txt])=>`<span style="color:var(--${k})"><i class="dot"></i><span style="color:var(--ink-soft)">${txt}</span></span>`).join("");
  document.getElementById("notes").innerHTML = t.notes
    .map(([ic,html])=>`<div class="note"><i class="fa-solid ${ic}"></i><div>${html}</div></div>`).join("");

  /* --- map markers --- */
  markers.clearLayers();
  const bounds = [[HOME.lat,HOME.lng]];
  L.marker([HOME.lat,HOME.lng],{icon:L.divIcon({className:"",html:'<div class="stamp stamp-home"><i class="fa-solid fa-house"></i></div>',iconSize:[38,38],iconAnchor:[19,19],popupAnchor:[0,-18]})})
   .bindPopup(`<div class="pop-head"><div class="pop-ico a-opt" style="background:var(--home)"><i class="fa-solid fa-house"></i></div>
      <div class="pop-ht"><div class="label">${t.startPoint}</div><h3>${t.homeName}</h3></div></div>
      <div class="pop-body"><p class="desc">${t.homeDesc}</p></div>`,{maxWidth:300})
   .addTo(markers);

  STOPS.forEach((s,i)=>{
    const num = s.n==="+" ? '<i class="fa-solid fa-plus"></i>' : s.n;
    const icon = L.divIcon({className:"",html:`<div class="stamp stamp-${s.key}"><span>${num}</span></div>`,iconSize:[38,38],iconAnchor:[19,19],popupAnchor:[0,-18]});
    const parkBtn = s.parkNav ? `<a class="btn btn-park" href="${appleQ(s.parkNav)}" target="_blank" rel="noopener"><i class="fa-solid fa-square-parking"></i> ${t.park}</a>` : "";
    const parkLine = s.park ? `<div class="pop-park"><i class="fa-solid fa-square-parking"></i> ${S(s.park)}</div>` : "";
    const head = s.n==="+" ? t.extra : `${t.stop} ${s.n}`;
    L.marker([s.lat,s.lng],{icon}).bindPopup(
      `<div class="pop-head"><div class="pop-ico a-${s.key}"><i class="fa-solid ${s.icon}"></i></div>
         <div class="pop-ht"><div class="label">${head} · ${S(s.area)}</div><h3>${S(s.name)}</h3></div></div>
       <div class="pop-body">
         ${legHTML(lang,i)}
         <div class="pop-dur"><i class="fa-regular fa-clock"></i> ${t.visit} ${s.dur}</div>
         <p class="desc">${S(s.desc)}</p>
         <div class="story"><span class="label"><i class="fa-solid fa-book-open"></i> ${t.story}</span><p>${S(s.story)}</p></div>
         ${parkLine}
         <div class="btns">
           <a class="btn btn-go" href="${appleNav(s.lat,s.lng)}" target="_blank" rel="noopener"><i class="fa-solid fa-diamond-turn-right"></i> ${t.navigate}</a>
           ${parkBtn}
         </div>
       </div>`,{maxWidth:300}).addTo(markers);
    bounds.push([s.lat,s.lng]);
  });
  if(!fitted){ map.fitBounds(bounds,{padding:[40,40]}); fitted = true; }

  if(layerCtl) map.removeControl(layerCtl);
  layerCtl = L.control.layers({[t.streets]:base.streets,[t.satellite]:base.sat},null,{position:"topright"}).addTo(map);

  /* --- itinerary cards --- */
  document.getElementById("stops").innerHTML = STOPS.map((s,i)=>{
    const num = s.n==="+" ? '<i class="fa-solid fa-plus"></i>' : s.n;
    const head = s.n==="+" ? t.extra : `${t.stop} ${s.n}`;
    const parkBtn = s.parkNav ? `<a class="btn btn-park" href="${appleQ(s.parkNav)}" target="_blank" rel="noopener"><i class="fa-solid fa-square-parking"></i> ${t.park}</a>` : "";
    const parkLine = s.park ? `<div class="park"><i class="fa-solid fa-square-parking"></i> ${S(s.park)}</div>` : "";
    return `<article class="card a-${s.key}">
      ${legHTML(lang,i)}
      <div class="card-head">
        <div class="card-stamp"><span>${num}</span></div>
        <div class="card-ht">
          <div class="label">${head} · ${S(s.area)}</div>
          <h3><i class="fa-solid ${s.icon}"></i>${S(s.name)}</h3>
        </div>
      </div>
      <div class="dur"><i class="fa-regular fa-clock"></i> ${t.visit} ${s.dur}</div>
      <p class="desc">${S(s.desc)}</p>
      <div class="story"><span class="label"><i class="fa-solid fa-book-open"></i> ${t.story}</span><p>${S(s.story)}</p></div>
      ${parkLine}
      <div class="btns">
        <a class="btn btn-go" href="${appleNav(s.lat,s.lng)}" target="_blank" rel="noopener"><i class="fa-solid fa-diamond-turn-right"></i> ${t.navigate}</a>
        ${parkBtn}
      </div>
    </article>`;
  }).join("");
}

/* ===== language selection ===== */
function detectLang(){
  try{ const saved = localStorage.getItem("bwt_lang"); if(saved==="en"||saved==="pt") return saved; }catch(e){}
  const nav = (navigator.languages && navigator.languages[0]) || navigator.language || "en";
  return nav.toLowerCase().startsWith("pt") ? "pt" : "en";
}
let lang = detectLang();
render(lang);

document.getElementById("langToggle").addEventListener("click",()=>{
  lang = (lang==="en") ? "pt" : "en";
  try{ localStorage.setItem("bwt_lang",lang); }catch(e){}
  render(lang);
});
</script>
